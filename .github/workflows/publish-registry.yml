# Tells the MCP registry when the plugin's version changes. No stored key: GitHub's OIDC token proves this repo's
# owner, which is what the registry asks for io.github.Flux-AI-Agent/*. Each version publishes once.
name: Publish to the MCP registry

on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Publish server.json
        run: |
          set -euo pipefail
          registry=https://registry.modelcontextprotocol.io
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$registry" | jq -r .value)
          token=$(jq -n --arg t "$oidc" '{oidc_token: $t}' \
            | curl -fsS -X POST "$registry/v0/auth/github-oidc" -H "Content-Type: application/json" -d @- \
            | jq -r .registry_token)
          curl -sS --fail-with-body -X POST "$registry/v0/publish" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d @server.json
